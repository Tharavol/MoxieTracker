name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create release archive
        run: |
          # WoW requires the addon to live in a folder named after the .toc, so
          # stage into MoxieTracker/ and zip that rather than zipping loose files.
          mkdir -p dist/MoxieTracker
          cp MoxieTracker.toc MoxieTracker.lua README.md CHANGELOG.md LICENSE dist/MoxieTracker/
          cp -r docs dist/MoxieTracker/
          cd dist
          zip -r "MoxieTracker-${GITHUB_REF_NAME}.zip" MoxieTracker
          unzip -l "MoxieTracker-${GITHUB_REF_NAME}.zip"

      - name: Verify archive layout
        run: |
          cd dist
          unzip -l "MoxieTracker-${GITHUB_REF_NAME}.zip" | grep -q 'MoxieTracker/MoxieTracker.toc'
          unzip -l "MoxieTracker-${GITHUB_REF_NAME}.zip" | grep -q 'MoxieTracker/MoxieTracker.lua'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MoxieTracker-${{ github.ref_name }}.zip
          draft: false
          prerelease: false
