name: Release

on:
  push:
    tags:
      # Stable releases only -- v1.2.0-alpha.1 etc. go through prerelease.yml
      # instead, so the two workflows never both fire on the same tag.
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Package and release
        uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

      # CI's dry-run build verifies layout too, but it skips itself on this
      # exact commit (see ci.yml) since packager won't double-build a tagged
      # commit. This is the only place the archive that actually ships gets
      # checked.
      - name: Verify archive layout
        run: |
          zip=$(ls .release/*.zip)
          unzip -l "$zip"
          unzip -l "$zip" | grep -q 'MoxieTracker/MoxieTracker.toc'
          unzip -l "$zip" | grep -q 'MoxieTracker/MoxieTracker_Config.lua'
          unzip -l "$zip" | grep -q 'MoxieTracker/MoxieTracker_Collect.lua'
          unzip -l "$zip" | grep -q 'MoxieTracker/MoxieTracker_UI.lua'
          unzip -l "$zip" | grep -q 'MoxieTracker/MoxieTracker_Options.lua'
          unzip -l "$zip" | grep -q 'MoxieTracker/MoxieTracker_Commands.lua'

          # Dev-only tooling / docs; .pkgmeta ignores them, and they should stay ignored.
          # A bare `!` here would be exempt from set -e and silently not fail.
          if unzip -l "$zip" | grep -q 'MoxieTracker/tests/'; then
            echo "tests/ should not ship in the release archive (see .pkgmeta)" >&2
            exit 1
          fi
          if unzip -l "$zip" | grep -q 'MoxieTracker/CHANGELOG.md'; then
            echo "CHANGELOG.md should not ship in the release archive (see .pkgmeta)" >&2
            exit 1
          fi
