name: Addon CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate addon files
        run: |
          test -f MoxieTracker.toc
          test -f MoxieTracker.lua
          test -f README.md
          test -f LICENSE

      - name: Check Lua syntax
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          luac5.1 -p MoxieTracker.lua
          echo 'Lua syntax OK'

      - name: Check TOC declares an interface version
        run: |
          grep -qE '^## Interface: [0-9]+' MoxieTracker.toc
          grep -qE '^MoxieTracker\.lua$' MoxieTracker.toc

  package:
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create release archive
        run: |
          # WoW requires the addon to live in a folder named after the .toc, so
          # stage into MoxieTracker/ and zip that rather than zipping loose files.
          mkdir -p dist/MoxieTracker
          cp MoxieTracker.toc MoxieTracker.lua README.md LICENSE dist/MoxieTracker/
          cp -r docs dist/MoxieTracker/
          cd dist
          zip -r MoxieTracker.zip MoxieTracker
          unzip -l MoxieTracker.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: moxietracker-release
          path: dist/MoxieTracker.zip
