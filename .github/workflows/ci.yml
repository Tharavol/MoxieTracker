name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Ubuntu's lua5.1 package ships both the lua5.1 interpreter and the
      # luac5.1 compiler used below for the syntax check.
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Syntax check
        run: luac5.1 -p *.lua

      - name: Check TOC declares an interface version
        run: |
          grep -qE '^## Interface: [0-9]+$' MoxieTracker.toc

      - name: Run tests
        run: lua5.1 tests/run.lua

      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.1"

      - uses: leafo/gh-actions-luarocks@v6

      - name: Install luacheck
        run: luarocks install luacheck

      - name: Luacheck
        run: luacheck .

  package:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # If this push also carries a tag on HEAD (e.g. a release commit pushed
      # together with its tag), BigWigsMods/packager intentionally no-ops on
      # the branch push to avoid a duplicate build, leaving no zip behind.
      # Detect that ourselves so the later steps skip deterministically
      # instead of racing the tag ref and failing when they lose.
      - name: Check for pending tag
        id: check_tag
        run: echo "tag=$(git tag --points-at HEAD)" >> "$GITHUB_OUTPUT"

      # -d skips uploading, so this builds the real release zip on every push
      # without publishing it. Packaging breakage surfaces here rather than at
      # tag time.
      - name: Build package
        if: steps.check_tag.outputs.tag == ''
        uses: BigWigsMods/packager@v2
        with:
          args: -d
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify archive layout
        if: steps.check_tag.outputs.tag == ''
        run: |
          zip=$(ls .release/*.zip)
          unzip -l "$zip"
          unzip -l "$zip" | grep -q 'MoxieTracker/MoxieTracker.toc'
          unzip -l "$zip" | grep -q 'MoxieTracker/MoxieTracker_Config.lua'
          unzip -l "$zip" | grep -q 'MoxieTracker/MoxieTracker_Collect.lua'
          unzip -l "$zip" | grep -q 'MoxieTracker/MoxieTracker_UI.lua'
          unzip -l "$zip" | grep -q 'MoxieTracker/MoxieTracker_Options.lua'
          unzip -l "$zip" | grep -q 'MoxieTracker/MoxieTracker_Commands.lua'

          # Dev-only tooling / docs; .pkgmeta ignores them, and they should stay ignored.
          # A bare `!` here would be exempt from set -e and silently not fail.
          if unzip -l "$zip" | grep -q 'MoxieTracker/tests/'; then
            echo "tests/ should not ship in the release archive (see .pkgmeta)" >&2
            exit 1
          fi
          if unzip -l "$zip" | grep -q 'MoxieTracker/CHANGELOG.md'; then
            echo "CHANGELOG.md should not ship in the release archive (see .pkgmeta)" >&2
            exit 1
          fi

      # The packager writes to .release/, which is a hidden path. Since
      # upload-artifact v4.4 hidden files are excluded unless asked for, so
      # this step uploaded nothing and only logged a warning. if-no-files-found
      # promotes a future miss to a failure rather than another quiet warning.
      - name: Upload artifact
        if: steps.check_tag.outputs.tag == ''
        uses: actions/upload-artifact@v7
        with:
          name: moxietracker-package
          path: .release/*.zip
          include-hidden-files: true
          if-no-files-found: error
